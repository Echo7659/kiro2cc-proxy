<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v= 用于击穿浏览器 favicon 缓存（该路径走 Cache-Control: max-age=3600） -->
    <link rel="icon" type="image/svg+xml" href="/logo-aurora-light.svg?v=aurora" />
    <link rel="alternate icon" type="image/png" href="/kiro-icon.png?v=aurora" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('admin-ui-theme-mode');
          if (mode !== 'light' && mode !== 'dark') {
            mode = localStorage.getItem('admin-ui-theme');
          }
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var color = localStorage.getItem('admin-ui-color-theme');
          document.documentElement.classList.add(
            // 兜底值必须与 use-theme.ts 的 DEFAULT_COLOR_THEME 保持一致（当前 'spotify'）
            'theme-' + (color && /^[a-z0-9-]+$/.test(color) ? color : 'spotify')
          );
        } catch (e) {
          /* localStorage 被禁用，走默认浅色 + spotify，由 use-theme.ts 正常接管 */
        }
      })();
    </script>
    <title>Kiro2CCProxy Admin</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plexsans-zYXzKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1syxeKYbSB4Zh.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plexmono--F63fjptAgt5VM-kVkqdyU8n1i8q131nj-o.woff2" />
    <link rel="stylesheet" href="/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
